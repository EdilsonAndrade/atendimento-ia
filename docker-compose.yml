services:
  interasisai-web:
    image: ghcr.io/edilsonandrade/interasisai-web:latest
    container_name: interasisai-web
    restart: always
    ports:
      - "3001:3001"
    environment:
      ADM_USER: ${ADM_USER}
      ADM_PWD: ${ADM_PWD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    networks:
      - proxy_default
  
  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    volumes:
      - redis_evolution_data:/data
    env_file:
      - ./atendimento-ia/.env
    networks:
      - proxy_default

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./atendimento-ia/.env
    environment:
      - SERVER_URL=https://evolution.interasisai.com.br
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD}@simplificandoai-db:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=true
      

      - WEBHOOK_GLOBAL_URL=http://chatatendimento-api:8000/api/v1/webhook/whatsapp/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    depends_on:
      - evolution_redis
    networks:
      - proxy_default

  chatatendimento-api:
    image: ghcr.io/edilsonandrade/atendimento-ia:latest
    container_name: chatatendimento-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    extra_hosts:
      # COMENTÁRIO: Permite que o container acesse serviços rodando no Host via 'host.docker.internal'
      - "host.docker.internal:host-gateway"
    env_file:
      - ./atendimento-ia/.env
    volumes:
      - ./atendimento-ia/credentials.json:/app/credentials.json
      - ./atendimento-ia/data:/app/data
      - ./atendimento-ia/db:/app/db
    networks:
      - proxy_default
   

networks:
  proxy_default:
    name: simplificandoai_default # Garanta que bate com o nome exato da rede do Nginx Proxy Manager
    external: true

volumes:
  redis_evolution_data: