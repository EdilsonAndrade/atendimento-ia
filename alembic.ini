# Configuração do Alembic — EDI-37
# Ver specs/004-alembic-migrations/ para o desenho completo.

[alembic]
# Diretório do script de migração (nomeado "migrations" em vez do "alembic" padrão:
# descreve o conteúdo e não se confunde com o pacote da biblioteca).
script_location = migrations

# Nome dos arquivos de revisão: 0001_baseline.py, 0002_descricao.py, ...
# ATENÇÃO: isto só formata o NOME do arquivo a partir do id da revisão; o Alembic
# continua gerando um hash aleatório se você não passar o id explicitamente. Para
# manter a numeração sequencial, crie revisões assim:
#     alembic revision -m "descricao" --rev-id 0002
# A cadeia real é garantida pelo down_revision, não pelo nome — o número sequencial
# existe apenas para a ordem ficar óbvia ao listar o diretório.
file_template = %%(rev)s_%%(slug)s

# Coloca a raiz do repositório no sys.path para que env.py consiga importar
# infrastructure.db_url (onde vive a normalização da URL de conexão).
prepend_sys_path = .
path_separator = os

# Fuso usado para o timestamp dentro do arquivo de revisão.
timezone = UTC

# IMPORTANTE: deixado VAZIO de propósito.
# A URL vem de POSTGRES_DATABASE_URI, lida em migrations/env.py — nenhuma
# credencial é versionada no repositório (exigência da constituição do projeto).
sqlalchemy.url =


[post_write_hooks]
# Nenhum hook de formatação configurado.


# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
