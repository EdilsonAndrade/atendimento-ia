services:
  interasisai-web:
    container_name: interasisai-web
    build:
      context: ./interasisai-web # Aponta para a subpasta do Next.js
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - proxy_default

  chatatendimento-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatatendimento-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      # COMENTÁRIO: Força o host da conexão Postgres para a rede interna do Docker do host da VPS
      - DATABASE_URL=postgresql://postgres:fNH687KsK2ggJ_EZT3ZUh0q80mqUuu0RuOdBnLOjmU8@host.docker.internal:5432/interasisai
      - POSTGRES_HOST=host.docker.internal
    extra_hosts:
      # COMENTÁRIO: Permite que o container acesse serviços rodando no Host via 'host.docker.internal'
      - "host.docker.internal:host-gateway"
    env_file:
      - ./atendimento-ia/.env
    networks:
      - proxy_default

networks: